<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Airline Satisfaction Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 980px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 8px; font-size: 14px; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 10px; }
    button { padding: 10px 14px; font-size: 14px; cursor: pointer; }
    .hint { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Airline Passenger Satisfaction</h2>
  <p class="hint">Fill in the fields and click Predict.</p>

  <div class="card">
    <form method="POST" action="/predict">
      <div class="grid">
        {% for f in features %}
          <div>
            <label for="{{ f }}">{{ f }}</label>
            <input name="{{ f }}" id="{{ f }}" type="text" required />
          </div>
        {% endfor %}
      </div>
      <br/>
      <button type="submit">Predict</button>
    </form>
  </div>
</body>
</html>
